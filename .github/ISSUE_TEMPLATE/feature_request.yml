name: Feature request
description: Propose a capability for hosts or terminal users.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a host or a terminal user cannot do today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like. Domain policy belongs to hosts; say which part belongs in this repository.
    validations:
      required: true
