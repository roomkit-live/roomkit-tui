[package]
name = "roomkit-tui-engine"
description = "Local RoomKit engine adapter for conversation clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: roomkit-rs is only on Git, and the crates.io name `roomkit`
# belongs to an unrelated project, which a published requirement would name.
publish = false
readme = "README.md"
keywords = ["roomkit", "ai", "agent", "chat", "llm"]
categories = ["command-line-interface", "api-bindings"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
roomkit.workspace = true
roomkit-core.workspace = true
roomkit-tui-protocol.workspace = true
roomkit-tui-transport.workspace = true
roomkit-ai.workspace = true
tokio.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
roomkit-sqlite.workspace = true
uuid.workspace = true

[lints]
workspace = true
